<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <title>Monster Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Column -->
        <div class="input-container">
            <h2>Monster Slain</h2>
            <input type="text" id="monster-name" placeholder="Monster Name">
            <textarea id="monster-description" placeholder="Description (optional)"></textarea>
            <input type="text" id="monster-type" placeholder="Type">
            <input type="number" id="monster-strength" placeholder="Strength">
            <input type="text" id="monster-weakness" placeholder="Weakness">
            <button id="add-monster-button">Well done.</button>
            <button id="update-monster-button">Update Monster</button>
        </div>

        <!-- Right Column -->
        <div class="log-container">
            <h2>Monsters Slain</h2>
            <div id="monster-list"></div>
        </div>
    </div>
    <!-- Auth Buttons -->
    <div class="auth-buttons">
        <button onclick="openModal('login')">Login</button>
        <button onclick="openModal('register')">Register</button>
        <button onclick="logout()" id="logout-button" style="display:none;">Logout</button>
        <button onclick="toggleDarkMode()" id="darkmode-button" style="display:none;">Toggle Dark Mode</button>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>

            <div id="register-section">
                <h2>Register</h2>
                <input type="text" id="register-firstname" placeholder="First Name">
                <input type="text" id="register-lastname" placeholder="Last Name">
                <input type="email" id="register-email" placeholder="Email">
                <input type="password" id="register-password" placeholder="Password">
                <button onclick="handleRegister()">Register</button>
                <hr>
            </div>

            <div id="login-section">
                <h2>Login</h2>
                <input type="email" id="login-email" placeholder="Email">
                <input type="password" id="login-password" placeholder="Password">
                <button onclick="handleLogin()">Login</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
